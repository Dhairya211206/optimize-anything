name: CI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Standalone Max-Cut QUBO Tests
      run: |
        python -m pytest maxcut_qubo.py -v

    - name: Run Track A Continuous Optimization Tests
      run: |
        python -m pytest trackA_continuous/test_optimizers.py -v

    - name: Run Track B Discrete Optimization Tests
      run: |
        python -m pytest trackB_discrete/test_track_b.py -v

    - name: Run Track D Submodular and Parallel Tests
      run: |
        python -m pytest trackD_submodular_parallel/test_track_d.py -v

    - name: Run Track E Case Study Tests
      run: |
        python -m pytest trackE_case_study/test_track_e.py -v

    - name: Run Track F Compiler Optimization Tests
      run: |
        python -m pytest trackF_compiler/test_track_f.py -v

    - name: Run Track H DBMS Optimization Tests
      run: |
        python -m pytest trackH_dbms/test_track_h.py -v

    - name: Run Track J Software Engineering Tests
      run: |
        python -m pytest trackJ_software_eng/test_track_j.py -v

